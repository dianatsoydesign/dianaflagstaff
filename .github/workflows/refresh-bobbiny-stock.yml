name: Refresh Bobbiny stock for all products

on:
  pull_request:
    paths:
      - 'src/lib/stock-refresh-auth.mjs'
      - 'scripts/stock-refresh-auth.test.mjs'
      - '.github/workflows/refresh-bobbiny-stock.yml'
      - 'scripts/push-bobbiny-stock.mjs'
      - 'scripts/bobbiny-inventory.test.mjs'
      - 'src/lib/bobbiny-inventory.mjs'
      - 'src/app/api/cron/bobbiny-stock/route.ts'
      - 'src/app/api/orders/route.ts'
      - 'src/lib/yarn-stock.ts'
      - 'src/data/bobbiny-premium-5mm.json'
      - 'src/data/bobbiny-stock-bootstrap.json'
      - 'src/lib/bobbiny-stock.ts'
      - 'src/components/product-purchase-form.tsx'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Verify Bobbiny access without publishing stock'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bobbiny-stock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stock rules
        run: node --test scripts/stock-refresh-auth.test.mjs scripts/bobbiny-inventory.test.mjs
      - name: Verify Bobbiny quantities and save stock
        env:
          STOCK_REFRESH_SECRET: ${{ github.event_name != 'pull_request' && secrets.STOCK_REFRESH_SECRET || '' }}
          SITE_URL: https://dianaflagstaff.com
          BOBBINY_STOCK_SECRET: ${{ github.event_name != 'pull_request' && secrets.BOBBINY_STOCK_SECRET || '' }}
          CHECK_ONLY: ${{ github.event_name == 'pull_request' || inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            node scripts/push-bobbiny-stock.mjs --check-only
          else
            node scripts/push-bobbiny-stock.mjs
          fi
