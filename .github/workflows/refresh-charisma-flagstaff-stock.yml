name: Refresh Flagstaff Charisma stock for hats and stockings

on:
  pull_request:
    paths:
      - 'src/lib/stock-refresh-auth.mjs'
      - 'scripts/stock-refresh-auth.test.mjs'
      - '.github/workflows/refresh-charisma-flagstaff-stock.yml'
      - 'scripts/push-charisma-flagstaff-stock.mjs'
      - 'scripts/charisma-flagstaff-inventory.test.mjs'
      - 'src/lib/charisma-inventory.mjs'
      - 'src/lib/bernat-inventory.mjs'
      - 'src/app/api/cron/charisma-flagstaff-stock/route.ts'
      - 'src/app/api/orders/route.ts'
      - 'src/lib/yarn-stock.ts'
      - 'src/data/charisma.json'
      - 'src/data/hat-yarns.json'
      - 'src/data/michaels-hat-catalog.mjs'
      - 'src/data/charisma-stock-bootstrap.json'
      - 'src/lib/charisma-flagstaff-stock.ts'
      - 'src/lib/charisma-stock-options.ts'
      - 'src/components/product-purchase-form.tsx'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Verify Michaels access without publishing stock'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flagstaff-charisma-stock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stock rules
        run: node --test scripts/stock-refresh-auth.test.mjs scripts/charisma-flagstaff-inventory.test.mjs
      - name: Verify Flagstaff pickup counts and save stock
        env:
          STOCK_REFRESH_SECRET: ${{ github.event_name != 'pull_request' && secrets.STOCK_REFRESH_SECRET || '' }}
          SITE_URL: https://dianaflagstaff.com
          CHARISMA_STOCK_SECRET: ${{ github.event_name != 'pull_request' && secrets.CHARISMA_STOCK_SECRET || '' }}
          CHECK_ONLY: ${{ github.event_name == 'pull_request' || inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            node scripts/push-charisma-flagstaff-stock.mjs --check-only
          else
            node scripts/push-charisma-flagstaff-stock.mjs
          fi
